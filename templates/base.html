<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ProposalDesk{% endblock %}</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e7e2da; --accent:#c2410c; --accent-ink:#fff; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); }
  header.top { background:var(--card); border-bottom:1px solid var(--line); }
  header.top .in { max-width:960px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:18px; }
  .logo { font-weight:700; font-size:18px; color:var(--ink); text-decoration:none; margin-right:auto; }
  .logo span { color:var(--accent); }
  nav a, nav button.link { color:var(--ink); text-decoration:none; font-size:15px; background:none; border:0; cursor:pointer; padding:0; font-family:inherit; }
  nav a:hover, nav button.link:hover { color:var(--accent); }
  nav form { display:inline; margin:0; }
  main { max-width:960px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:26px; margin:0 0 6px; } h2 { font-size:18px; margin:28px 0 10px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .btn { display:inline-block; background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.danger { background:transparent; color:var(--bad); border:1px solid var(--line); }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 5px; }
  input, textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:110px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > * { flex:1; min-width:160px; }
  .alert { padding:10px 14px; border-radius:8px; margin:14px 0; font-size:15px; }
  .alert.err { background:#fef2f2; color:var(--bad); border:1px solid #fecaca; }
  .alert.ok { background:#f0fdf4; color:var(--ok); border:1px solid #bbf7d0; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); font-size:15px; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; background:#eee; }
  .badge.Draft { background:#f3f4f6; color:#4b5563; } .badge.Sent { background:#dbeafe; color:#1d4ed8; }
  .badge.Accepted { background:#dcfce7; color:#15803d; } .badge.Rejected { background:#fee2e2; color:#b91c1c; }
  .filters a { margin-right:14px; text-decoration:none; color:var(--muted); font-size:15px; } .filters a.on { color:var(--accent); font-weight:700; }
  code.url { display:block; padding:10px 12px; background:#f6f3ee; border:1px solid var(--line); border-radius:8px; word-break:break-all; font-size:14px; }
  @media (max-width:600px){ .hide-s { display:none; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="/">Proposal<span>Desk</span></a>
  <nav>
  {% if user %}
    <a href="/proposals">Proposals</a>&nbsp;&nbsp;
    <a href="/connect">Connect Claude</a>&nbsp;&nbsp;
    <form method="post" action="/logout"><button class="link" type="submit">Log out</button></form>
  {% else %}
    <a href="/login">Log in</a>&nbsp;&nbsp;<a href="/signup">Sign up</a>
  {% endif %}
  </nav>
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
